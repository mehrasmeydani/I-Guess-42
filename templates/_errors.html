{# A form that came back with problems: the summary first, which takes
   focus (app.js), then each field says its own. #}
{% match errors.summary %}
  {% when Some with (e) %}
    <div class="error-summary" role="alert" tabindex="-1">
      <p><b>that didn't work.</b> {{ e }}</p>
    </div>
  {% when None %}
{% endmatch %}
