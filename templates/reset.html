{% extends "base.html" %}
{% block title %}New password &middot; i guess low{% endblock %}
{% block h1 %}pick a new password{% endblock %}

{% block content %}
<section class="sec" style="--b: 0">
  <h2 class="rule"><span>pick a new password</span></h2>
  {% include "_notice.html" %}
  <form class="authform" method="post" action="/reset">
    <input type="hidden" name="token" value="{{ token }}">
    <label for="password">new password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required
           minlength="10" maxlength="128" aria-describedby="password-hint">
    <p class="hint" id="password-hint">at least 10 characters. this signs you out everywhere else.</p>
    <button type="submit">save it and sign in &rarr;</button>
  </form>
</section>
{% endblock %}
