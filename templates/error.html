{% extends "base.html" %}
{% block title %}{{ status }} &middot; i guess low{% endblock %}
{% block h1 %}Error {{ status }}{% endblock %}

{% block content %}

    <a class="btn-primary" href="/">Back to today's round</a>
  </div>
</section>
{% endblock %}
