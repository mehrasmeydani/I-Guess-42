[package]
name = "i_guess_42"
# Not the version the site shows - that is version.txt, which the footer
# prints. Changing this one invalidates the Docker dependency layer and
# recompiles every crate, so it stays put unless the crate itself is published.
version = "1.1.0"
edition = "2021"
# Verified by the `msrv` job in CI, not asserted. 1.88 is the real floor: the
# `time` and `icu_*` crates in Cargo.lock declare it, and 1.80 had not built
# since `cpufeatures` moved to edition 2024 (which needs cargo 1.85).
rust-version = "1.88"

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "derive",  # #[derive(FromRow)]
    "macros",  # sqlx::migrate!
    "migrate",
] }
askama = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
chrono-tz = "0.10"
rand = "0.8"
# Cookie max-age is expressed with `time::Duration` (the type the `cookie`
# crate behind axum-extra uses); cargo unifies this with that copy of time.
time = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
anyhow = "1"
# Password hashing (argon2id), and SHA-256 / HMAC for the tokens in emailed
# links and the hashed IP addresses: never stored in the clear.
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
hmac = "0.12"
# The shape of emails and usernames. Its engine is already in the tree
# through tracing-subscriber's env-filter.
regex = "1"
# Encodes the per-round link-preview image (og.rs). Pure Rust, small.
png = "0.17"
# The QR code on the leaderboard image, pointing at the site. Pure Rust, no
# dependencies.
qrcodegen = "1.8"
# Draws the leaderboard image's text in the site's monospace (DejaVu Sans
# Mono, in src/fonts). Pure Rust.
fontdue = "0.9"

[dev-dependencies]
# Already in the tree via reqwest; used to feed sample /v2/me bodies to tests.
serde_json = "1"
# Already in the tree via axum; lets a test send a request through a router.
tower = { version = "0.5", features = ["util"] }
# Reads the leaderboard image's QR code back in a test, so its styling is
# known to scan.
rqrr = { version = "0.11", default-features = false }

[profile.release]
opt-level = 3
# Thin, not fat. Measured on this tree: a source-only change relinks in 10s
# with thin and 38s with fat, and a full build is 60s against 86s. Fat LTO
# buys 3.8 MB off a 142 MB image - under 3% - and nothing measurable at
# runtime for a server that spends its life waiting on SQLite and HTTP.
lto = "thin"
